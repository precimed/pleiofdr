name: container

# Builds the Docker and Apptainer images (linux/amd64), tests them offline, and on v* tags
# publishes the Docker image to ghcr.io and attaches the .sif to the GitHub release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_DATA_URL: https://precimed.s3-eu-west-1.amazonaws.com/pleiofdr/pleioFDR_demo_data.tar.gz

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the version is the same everywhere
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          grep -q "^ARG VERSION=${version}$" Dockerfile || { echo "Dockerfile VERSION != $version"; exit 1; }
          grep -q "org.opencontainers.image.version ${version}$" Apptainer.def || { echo "Apptainer.def version != $version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF_NAME#v}
            [[ "$tag" == "$version" || "$tag" == "$version"-* ]] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pleiofdr:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Self-test without network, as other users and on a read-only root filesystem
        run: |
          run="docker run --rm --network none"
          $run pleiofdr:ci --version
          # host user id (HOME=/ is not writable), as in the README
          $run -u "$(id -u):$(id -g)" --entrypoint python pleiofdr:ci -m pleiofdr.selftest
          # read-only root with a writable /tmp
          $run -u 12345:12345 --read-only --tmpfs /tmp --entrypoint python pleiofdr:ci -m pleiofdr.selftest
          # read-only root, no /tmp; only the bind-mounted data folder is writable
          mkdir -m 777 "$RUNNER_TEMP/rw"
          $run -u 12345:12345 --read-only -v "$RUNNER_TEMP/rw:/data" --entrypoint python pleiofdr:ci \
            -m pleiofdr.selftest --keep /data/selftest

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Cache demo data
        id: demo-cache
        uses: actions/cache@v6
        with:
          path: pleioFDR_demo_data.tar.gz
          key: pleioFDR-demo-data-v1
      - name: Download demo data
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o pleioFDR_demo_data.tar.gz "$DEMO_DATA_URL"
      - name: Demo run offline, compared with MATLAB
        run: |
          mkdir demo && tar -xzf pleioFDR_demo_data.tar.gz -C demo
          # exactly the README command: host user id, data bind-mounted, no network
          tests/container/demo_parity.sh demo -- \
            docker run --rm --network none -u "$(id -u):$(id -g)" -v "$PWD/demo:/data" pleiofdr:ci

      - name: Save image for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save pleiofdr:ci | gzip > "pleiofdr-${{ steps.version.outputs.version }}-docker.tar.gz"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: docker-image
          path: pleiofdr-*-docker.tar.gz
          retention-days: 7

  apptainer:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -q
          sudo apt-get install -y -q apptainer
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Apptainer uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          apptainer --version

      - name: Build image
        run: |
          sudo apptainer build pleiofdr.sif Apptainer.def
          sudo chown "$(id -u):$(id -g)" pleiofdr.sif
          ls -lh pleiofdr.sif

      - name: apptainer test
        run: apptainer test pleiofdr.sif
      - name: Self-test with networking disabled
        run: sudo apptainer exec --net --network none --containall pleiofdr.sif python -m pleiofdr.selftest

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Cache demo data
        id: demo-cache
        uses: actions/cache@v6
        with:
          path: pleioFDR_demo_data.tar.gz
          key: pleioFDR-demo-data-v1
      - name: Download demo data
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o pleioFDR_demo_data.tar.gz "$DEMO_DATA_URL"
      - name: Demo run in an isolated container, compared with MATLAB
        run: |
          mkdir demo && tar -xzf pleioFDR_demo_data.tar.gz -C demo
          tests/container/demo_parity.sh demo -- \
            apptainer run --containall --no-home -B "$PWD/demo:/data" --pwd /data pleiofdr.sif

      - name: Checksum
        run: |
          name="pleiofdr-${{ needs.docker.outputs.version }}.sif"
          mv pleiofdr.sif "$name"
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: apptainer-image
          path: pleiofdr-*.sif*
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [docker, apptainer]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pleiofdr"
          tag=${GITHUB_REF_NAME#v}
          {
            echo "tags<<EOF"
            echo "$image:$tag"
            # pre-releases (e.g. v2.0.0-rc1) do not move :latest
            [[ "$tag" == *-* ]] || echo "$image:latest"
            echo "EOF"
            if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ needs.docker.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach images to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--generate-notes --title "pleioFDR $GITHUB_REF_NAME")
            [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
